# ============================================================================
# pdf2epub 配置
#
# 优先级：环境变量 (PDF2EPUB__SECTION__KEY) > 本文件 > 内置默认值
#
# 流水线只有四步，配置也只有四块：
#   prepare   脚本：切分 PDF -> PaddleOCR -> 产物归一
#   calibrate LLM ：对着页面图校准（含接缝核对）
#   compose   LLM ：把内容直接写成 EPUB
#   check     脚本：打包 + 格式校验
# ============================================================================

workdir = ".pdf2epub"          # 运行目录（中间产物、日志、告警都在这里）
language = "ch"                # 解析语言（PaddleOCR 自行识别，这里主要用于工单文案）
log_level = "INFO"
log_json = true                # 结构化日志，便于机器读取
alert_webhook = ""             # 可选：告警 POST 到该 URL
alert_command = ""             # 可选：告警时执行的外部命令

# ---------------------------------------------------------------------------
# PaddleOCR 解析后端（AI Studio 承载的 PaddleOCR-VL）
# ---------------------------------------------------------------------------
[paddle]
base_url = "https://paddleocr.aistudio-app.com"
token_env = "PADDLE_TOKEN"     # 从哪个环境变量读 Token
model = "PaddleOCR-VL-1.6"

use_doc_orientation_classify = false
use_doc_unwarping = false
use_chart_recognition = false

poll_interval = 5.0            # 轮询间隔（秒）
poll_timeout = 3600.0          # 单个 job 最长等待（秒）
http_timeout = 60.0
max_retries = 4                # 网络/5xx 重试次数
retry_backoff = 2.0

# 每片页数刻意取小（20 页），不是"保险起见"，是两条硬理由：
#   1. 一个分片一个解析 job，小片并行，整本书更快出结果；
#   2. 片与片之间的接缝（前一片末页 + 后一片首页）是唯一"跨边界"的地方，
#      片小才核得过来——prepare 会逐片对账页数、把接缝页列出来，
#      见 <run>/parsing/boundary.md，校准工单里也要求对着页面图核对接缝两页。
max_pages_per_task = 20
max_bytes_per_task = 200000000
max_files_per_batch = 50       # 一次 run 最多提交多少个 job（防止刷爆额度）

# ---------------------------------------------------------------------------
# 校准：挑出 MinerU 自己也没把握的段落，交给 LLM 对着页面图改
# ---------------------------------------------------------------------------
[calibrate]
score_threshold = 0.75         # 低于此置信度的段落进入校准清单
critical_score = 0.5           # 低于此值算"肯定要人看"，用于排序
max_segments = 200             # 单次最多派多少条，防止烂书把工单做成天书
context_pages = 1              # 每个低分段额外附前后各几页的渲染图
context_chars = 600            # 工单里每条附多少字的原文上下文
render_dpi = 140               # 页面图渲染 DPI
max_image_width = 1500         # 页面图最大宽度（px）

# ---------------------------------------------------------------------------
# 撰写：LLM 直接写 build/book.json 与 build/OEBPS/text/*.xhtml
# ---------------------------------------------------------------------------
[compose]
chapter_prefix = "ch"          # 章节文件前缀（ch001.xhtml ...）
scaffold_sample = true         # 放一个样例章节，让 LLM 有具体参照
allow_empty_metadata = true    # 元数据不确定时允许留空，脚本不报错

# ---------------------------------------------------------------------------
# 校验：只报告，不修复。改文本是 LLM 的事。
# ---------------------------------------------------------------------------
[validate]
epubcheck_mode = "auto"        # auto=有就用 / require=必须跑，没有就判失败 / off=完全不跑
epubcheck_jar = ""             # 留空则自动探测（EPUBCHECK_JAR / PATH / tools/** 等常见位置）
java_cmd = "java"
fail_on_severity = "ERROR"     # FATAL | ERROR | WARNING（WARNING 更严格）
