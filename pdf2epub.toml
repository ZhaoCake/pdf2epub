# ============================================================================
# pdf2epub 配置
#
# 优先级：环境变量 (PDF2EPUB__SECTION__KEY) > 本文件 > 内置默认值
#
# 流水线只有四步，配置也只有四块：
#   prepare   脚本：解析 PDF -> MinerU -> 解压产物
#   calibrate LLM ：对着页面图校准低分段落
#   compose   LLM ：把内容直接写成 EPUB
#   check     脚本：打包 + 格式校验
# ============================================================================

workdir = ".pdf2epub"          # 运行目录（中间产物、日志、告警都在这里）
language = "ch"                # 解析语言，透传给 MinerU
log_level = "INFO"
log_json = true                # 结构化日志，便于机器读取
alert_webhook = ""             # 可选：告警 POST 到该 URL
alert_command = ""             # 可选：告警时执行的外部命令

# ---------------------------------------------------------------------------
# MinerU 官方 API（https://mineru.net/apiManage/docs）
# ---------------------------------------------------------------------------
[mineru]
base_url = "https://mineru.net"
token_env = "MINERU_TOKEN"     # 从哪个环境变量读 Token
model_version = "vlm"          # pipeline | vlm | MinerU-HTML
is_ocr = "auto"                # auto | true | false，auto 时按页面是否含文本层决定
enable_formula = true
enable_table = true
extra_formats = []             # ["docx","html","latex"]，一般不需要

poll_interval = 5.0            # 轮询间隔（秒）
poll_timeout = 3600.0          # 单个任务最长等待（秒）
http_timeout = 60.0
max_retries = 4                # 网络/5xx 重试次数
retry_backoff = 2.0

# 官方限制（超出会自动切分 PDF）
max_pages_per_task = 200
max_bytes_per_task = 200000000
max_files_per_batch = 50
concurrency = 4                # 并发提交/轮询的任务数

# ---------------------------------------------------------------------------
# 校准：挑出 MinerU 自己也没把握的段落，交给 LLM 对着页面图改
# ---------------------------------------------------------------------------
[calibrate]
score_threshold = 0.75         # 低于此置信度的段落进入校准清单
critical_score = 0.5           # 低于此值算"肯定要人看"，用于排序
max_segments = 200             # 单次最多派多少条，防止烂书把工单做成天书
context_pages = 1              # 每个低分段额外附前后各几页的渲染图
context_chars = 600            # 工单里每条附多少字的原文上下文
render_dpi = 140               # 页面图渲染 DPI
max_image_width = 1500         # 页面图最大宽度（px）

# ---------------------------------------------------------------------------
# 撰写：LLM 直接写 build/book.json 与 build/OEBPS/text/*.xhtml
# ---------------------------------------------------------------------------
[compose]
chapter_prefix = "ch"          # 章节文件前缀（ch001.xhtml ...）
scaffold_sample = true         # 放一个样例章节，让 LLM 有具体参照
allow_empty_metadata = true    # 元数据不确定时允许留空，脚本不报错

# ---------------------------------------------------------------------------
# 校验：只报告，不修复。改文本是 LLM 的事。
# ---------------------------------------------------------------------------
[validate]
epubcheck_jar = ""             # 留空则自动探测（环境变量 EPUBCHECK_JAR / PATH / 常见位置）
java_cmd = "java"
require_epubcheck = false      # true 则找不到 EPUBCheck 直接判失败
fail_on_severity = "ERROR"     # FATAL | ERROR | WARNING（WARNING 更严格）
